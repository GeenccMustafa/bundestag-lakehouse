[project]
name = "bundestag-lakehouse"
version = "0.1.0"
description = "Bronze → Silver → Gold lakehouse on the Bundestag DIP API"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.118",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: needs the local Docker stack and network access"]
