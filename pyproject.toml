[project]
name = "bundestag-lakehouse"
version = "0.1.0"
description = "Bronze → Silver → Gold lakehouse on the Bundestag DIP API"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "httpx>=0.28",
]

[dependency-groups]
# The Streamlit dashboard on Gold (dashboard/). Reads DuckLake through DuckDB, like dbt.
dashboard = [
    "duckdb>=2.0",
    "streamlit>=1.66.1",
]
# Everything dbt needs. Also installed into the Airflow image (in its own venv), pinned by
# uv.lock: the Dockerfile exports this group with `uv export` at build time.
dbt = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
    "duckdb>=2.0",
]
dev = [
    {include-group = "dbt"},
    {include-group = "dashboard"},
    "boto3-stubs[s3]>=1.43.118",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "D"]
# D107: the class docstring documents __init__ arguments (Google style).
# D105: magic methods like __enter__ need no docstring.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
# The SQL there is assembled from module constants only; every user value is a bound parameter.
"dashboard/queries.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration and not lake'"
markers = [
    "integration: needs the local Docker stack and network access",
    "lake: needs the sample-data lake from `dbt build --target ci`",
]
