# Weekly PRs for outdated dependencies, actions (incl. pinned SHAs) and Docker image tags.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A Postgres major upgrade needs a dump/restore of Airflow's metadata DB; do it by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
