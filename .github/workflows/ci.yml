name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can only read the repo unless they ask for more.
permissions:
  contents: read

# A new push to the same branch/PR cancels the previous, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      # --locked: fail if uv.lock is out of date instead of silently re-resolving.
      - run: uv sync --locked

      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run pytest

  dbt:
    # `--target ci`: DuckLake with a local catalog file, Bronze from the sample pages in
    # dbt/sample_data/bronze. No RustFS, Postgres or credentials needed.
    name: dbt build (sample data)
    runs-on: ubuntu-latest
    env:
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
      BRONZE_ROOT: ${{ github.workspace }}/dbt/sample_data/bronze
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # slim CI parses the base branch

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - run: uv sync --locked --only-group dbt

      - run: mkdir -p /tmp/bundestag-dbt-ci && uv run dbt deps

      - name: Full build (push to main)
        if: github.event_name != 'pull_request'
        run: uv run dbt build --target ci

      # Slim CI: compare against the base branch's manifest and build only what the PR changed
      # plus everything downstream of it. `@` also selects every parent of those nodes (seeds,
      # upstream models), which must exist in the empty CI lake; `+state:modified+` would miss
      # parents of the downstream models, e.g. a seed joined in two levels below a changed source.
      - name: Slim build (pull request)
        if: github.event_name == 'pull_request'
        run: |
          BASE="$RUNNER_TEMP/base"
          git worktree add "$BASE" "origin/$GITHUB_BASE_REF"
          uv run dbt deps --project-dir "$BASE/dbt" --profiles-dir dbt
          uv run dbt parse --project-dir "$BASE/dbt" --profiles-dir dbt --target ci \
            --target-path base-state
          echo "Changed vs $GITHUB_BASE_REF:"
          uv run dbt ls --target ci --select state:modified --state "$BASE/dbt/base-state" \
            --output name --quiet || true
          uv run dbt build --target ci --select @state:modified --state "$BASE/dbt/base-state"

  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .env.example has placeholders for every variable, so no real secrets are needed.
      - run: docker compose --env-file .env.example config --quiet
