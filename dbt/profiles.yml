# Credentials come from the environment only. On the host: `uv run --env-file .env dbt ...`
# (RUSTFS_* + localhost); inside Compose the S3_* variables and endpoint rustfs:9000 are set.
bundestag:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/lakehouse.duckdb') }}"
      threads: 4
      extensions: [httpfs, json]
      secrets:
        - type: s3
          key_id: "{{ env_var('S3_ACCESS_KEY', env_var('RUSTFS_ACCESS_KEY', '')) }}"
          secret: "{{ env_var('S3_SECRET_KEY', env_var('RUSTFS_SECRET_KEY', '')) }}"
          endpoint: "{{ env_var('S3_ENDPOINT', 'localhost:9000') }}"
          url_style: path
          use_ssl: false
          region: us-east-1
