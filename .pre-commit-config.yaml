# Runs on every `git commit` (after `uv run pre-commit install`) and in CI.
# Update hook versions with: uv run pre-commit autoupdate
default_install_hook_types: [pre-commit]

# Vendored skills are copied from upstream as-is; don't let hooks rewrite them.
# Raw API pages in dbt/sample_data are byte-exact copies of Bronze; never rewrite them either.
exclude: ^(\.claude/skills/(?!lakehouse-architecture|dip-api-ingestion|dimensional-modeling|security-baseline)[^/]+/|dbt/sample_data/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      # Fails if pyproject.toml changed but uv.lock wasn't updated.
      - id: uv-lock
      # Pinned dbt requirements for the Airflow image, kept in sync with uv.lock.
      - id: uv-export
        args: [--only-group, dbt, --no-emit-project, --frozen, --output-file, dbt/requirements.txt, --quiet]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
