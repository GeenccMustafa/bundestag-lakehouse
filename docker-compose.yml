# Local lakehouse stack: RustFS (S3 object store) + Airflow 3 (LocalExecutor) + Postgres (Airflow metadata).
#
#   cp .env.example .env   # then fill in real values
#   docker compose up -d
#
# Every secret comes from .env via ${VAR:?...}: a missing value stops `compose up` instead of
# silently falling back to a well-known default. All ports are bound to 127.0.0.1 only.
name: bundestag-lakehouse

x-airflow-common: &airflow-common
  # Airflow 3.3.2 + Cosmos + dbt (docker/airflow/Dockerfile).
  image: bundestag-lakehouse/airflow:3.3.2-cosmos
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres/${POSTGRES_DB:?set in .env}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Makes the mounted ./ingestion package importable from DAGs.
    PYTHONPATH: /opt/airflow
    # Passed through to DAGs (Phase 1).
    DIP_API_KEY: ${DIP_API_KEY:-}
    S3_ENDPOINT_URL: http://rustfs:9000
    S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set in .env}
    S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set in .env}
    # dbt (Phase 4): the profile reads these; services are reached by their Compose names.
    S3_ENDPOINT: rustfs:9000
    DUCKLAKE_PG_HOST: postgres
    DUCKLAKE_PG_PORT: "5432"
    DUCKLAKE_PG_DB: ${DUCKLAKE_PG_DB:?set in .env}
    DUCKLAKE_PG_USER: ${DUCKLAKE_PG_USER:?set in .env}
    DUCKLAKE_PG_PASSWORD: ${DUCKLAKE_PG_PASSWORD:?set in .env}
    DBT_THREADS: "2"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./ingestion:/opt/airflow/ingestion:ro
    - ./dbt:/opt/airflow/dbt
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  # Object store for the Bronze layer (see docs/adr/0001).
  rustfs:
    image: rustfs/rustfs:1.0.4
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set in .env}
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Web console
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Airflow metadata DB and the DuckLake catalog (separate database and role, see
  # postgres-init). Published on localhost:5433 so dbt and DuckDB on the host can reach the
  # DuckLake catalog; 5433 avoids clashing with a locally installed Postgres.
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # One-shot: creates the DuckLake catalog role + database (idempotent), then exits.
  postgres-init:
    image: postgres:16.15-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:?set in .env}
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -v
      - ducklake_user=${DUCKLAKE_PG_USER:?set in .env}
      - -v
      - ducklake_password=${DUCKLAKE_PG_PASSWORD:?set in .env}
      - -v
      - ducklake_db=${DUCKLAKE_PG_DB:?set in .env}
      - -f
      - /init/init-ducklake.sql
    volumes:
      - ./docker/postgres/init-ducklake.sql:/init/init-ducklake.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: migrates the DB, creates the admin user, fixes folder ownership, then exits.
  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        # dbt packages and the manifest the Cosmos DAG renders from, once per stack start.
        /opt/airflow/dbt-venv/bin/dbt deps --project-dir /opt/airflow/dbt --profiles-dir /opt/airflow/dbt --quiet
        /opt/airflow/dbt-venv/bin/dbt parse --project-dir /opt/airflow/dbt --profiles-dir /opt/airflow/dbt \
          --target-path target-airflow --no-partial-parse --quiet
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/dbt/dbt_packages /opt/airflow/dbt/target-airflow
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?set in .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set in .env}
    restart: "no"

  # Airflow 3 UI + REST API + Execution API (tasks report back to it).
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Decides what runs when; with LocalExecutor it also runs the tasks.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Parses DAG files. Split out in Airflow 3 so user DAG code never runs inside the scheduler.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Runs deferrable tasks (async waits, e.g. sensors) without holding a worker slot.
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Web UI for Postgres at http://localhost:5050 (desktop mode: no pgAdmin login, localhost
  # only). Both databases are pre-registered (docker/pgadmin/servers.json); their passwords
  # are written from .env into a pgpass file at start-up, so nothing secret is in the repo.
  # servers.json assumes the default usernames from .env.example (airflow / ducklake).
  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DUCKLAKE_PG_DB: ${DUCKLAKE_PG_DB:?set in .env}
      DUCKLAKE_PG_USER: ${DUCKLAKE_PG_USER:?set in .env}
      DUCKLAKE_PG_PASSWORD: ${DUCKLAKE_PG_PASSWORD:?set in .env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        printf 'postgres:5432:%s:%s:%s\n' "$$POSTGRES_DB" "$$POSTGRES_USER" "$$POSTGRES_PASSWORD" > /tmp/pgpass
        printf 'postgres:5432:%s:%s:%s\n' "$$DUCKLAKE_PG_DB" "$$DUCKLAKE_PG_USER" "$$DUCKLAKE_PG_PASSWORD" >> /tmp/pgpass
        exec /entrypoint.sh
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rustfs-data:
  postgres-data:
  pgadmin-data:
